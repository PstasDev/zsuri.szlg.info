{% extends 'base.html' %}
{% block title %}Bejelentkezés{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-8 rounded-lg shadow-xl border border-gray-700">
    <h2 class="text-3xl font-bold mb-6 text-center text-blue-400">Bejelentkezés</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-300 text-sm font-bold mb-2" for="id_username">
                Felhasználónév
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500 bg-gray-700 text-white border-gray-600" id="id_username" name="username" type="text" placeholder="Felhasználónév" required>
        </div>
        <div class="mb-6">
            <label class="block text-gray-300 text-sm font-bold mb-2" for="id_password">
                Jelszó
            </label>
            <input class="shadow appearance-none border border-red-500 rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500 bg-gray-700 text-white border-gray-600" id="id_password" name="password" type="password" placeholder="******************" required>
        </div>
        {% if form.errors %}
            <p class="text-red-500 text-xs italic mb-4">Helytelen felhasználónév vagy jelszó.</p>
        {% endif %}
        <div class="flex items-center justify-between">
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition duration-300 w-full" type="submit">
                Bejelentkezés
            </button>
        </div>
    </form>
</div>
{% endblock %}
